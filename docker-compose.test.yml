version: '3.8'

services:
  postgres-test:
    image: postgres:15
    container_name: bug-tracker-postgres-test
    environment:
      POSTGRES_DB: bugtracker_test
      POSTGRES_USER: bugtracker_test
      POSTGRES_PASSWORD: bugtracker_test
    ports:
      - "5433:5432"  # Different port to avoid conflicts
    volumes:
      - postgres_test_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bugtracker_test -d bugtracker_test"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - bug-tracker-test-network

networks:
  bug-tracker-test-network:
    driver: bridge

volumes:
  postgres_test_data: 